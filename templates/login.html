<!doctype html>
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>ProSkills Academia - Iniciar Sesión</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../static/static-login/style.css" />
  </head>
  <body class="bg-body-secondary">
    <div
      class="container min-vh-100 d-flex align-items-center justify-content-center py-5"
    >
      <div
        class="card shadow border-0 p-4"
        style="width: 100%; max-width: 420px; rounded-3: 1rem"
      >
        <div class="text-center mb-4">
          <a href="index.html">
            <img
              src="../static/ProSkills.png"
              alt="Logo ProSkills Academia"
              width="75"
              height="60"
              class="img-fluid mb-2"
            />
          </a>
          <h4 class="fw-bold text-dark mb-1">Ingresa a tu cuenta</h4>
          <p class="text-muted small">SGAP - Sistema de Gestión Académica</p>
        </div>

        <form>
          <div class="form-floating mb-3">
            <input
              type="email"
              class="form-control"
              id="floatingInput"
              placeholder="correo@ejemplo.com"
              required
            />
            <label for="floatingInput" class="text-muted small"
              >Correo electrónico o RUN</label
            >
          </div>

          <div class="form-floating mb-3">
            <input
              type="password"
              class="form-control"
              id="floatingPassword"
              placeholder="Contraseña"
              required
            />
            <label for="floatingPassword" class="text-muted small"
              >Contraseña</label
            >
          </div>

          <div
            class="d-flex align-items-center justify-content-between mb-4 small"
          >
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rememberMe" />
              <label class="form-check-input-label text-muted" for="rememberMe">
                Recordarme
              </label>
            </div>
            <a
              href="about.html#soporte"
              class="text-primary text-decoration-none"
              >¿Olvidaste tu contraseña?</a
            >
          </div>

          <button
            class="btn btn-primary w-100 py-2 fw-bold mb-3 shadow-sm"
            type="submit"
          >
            Iniciar Sesión
          </button>

          <div class="text-center">
            <a href="/" class="text-muted small text-decoration-none">
              ← Volver a la página de inicio
            </a>
          </div>
        </form>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
