<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>ProSkills Academia - Recuperar Contraseña</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../static/static-login/style.css" />
  </head>
  <body class="bg-body-secondary">
    <div
      class="container min-vh-100 d-flex align-items-center justify-content-center py-5"
    >
      <div
        class="card shadow border-0 p-4"
        style="width: 100%; max-width: 420px; border-radius: 1rem"
      >
        <div class="text-center mb-4">
          <a href="/">
            <img
              src="../static/ProSkills.png"
              alt="Logo ProSkills"
              width="75"
              height="60"
              class="img-fluid mb-2"
            />
          </a>
          <h4 class="fw-bold text-dark mb-1">¿Problemas para ingresar?</h4>
          <p class="text-muted small px-2">
            Ingresa tu correo registrado y te enviaremos un enlace seguro para
            restablecer tu contraseña inmediatamente.
          </p>
        </div>

        <form>
          <div class="form-floating mb-4">
            <input
              type="email"
              class="form-control"
              id="floatingRecoverEmail"
              placeholder="correo@ejemplo.com"
              required
            />
            <label for="floatingRecoverEmail" class="text-muted small"
              >Dirección de correo electrónico</label
            >
          </div>

          <button
            class="btn btn-primary w-100 py-2 fw-bold mb-3 shadow-sm"
            type="submit"
          >
            Enviar Enlace de Recuperación
          </button>

          <div
            class="d-flex justify-content-between align-items-center mt-3 small"
          >
            <a href="/login" class="text-muted text-decoration-none"
              >← Volver al Login</a
            >
            <a
              href="/about"
              class="text-primary text-decoration-none fw-semibold"
              >Contactar a Soporte</a
            >
          </div>
        </form>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
